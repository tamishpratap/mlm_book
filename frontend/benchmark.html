<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MLM BOOK AI - Phase 3 NSFW Engine Foundation Benchmark</title>
  <style>
    body { font-family: monospace; background: #0b1120; color: #f8fafc; padding: 24px; line-height: 1.5; }
    h1 { color: #38bdf8; margin-bottom: 4px; }
    .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    #status { padding: 12px 16px; border-radius: 6px; background: #1e293b; margin-bottom: 16px; font-weight: bold; }
    #status.pass { background: #064e3b; color: #34d399; }
    #status.fail { background: #7f1d1d; color: #f87171; }
    pre { background: #0f172a; border: 1px solid #334155; padding: 16px; border-radius: 8px; overflow: auto; max-height: 600px; }
  </style>
</head>
<body>
  <h1>MLM BOOK AI — Phase 3 NSFW Engine Foundation</h1>
  <div class="subtitle">Controlled Browser Machine Learning & Performance Benchmark</div>
  <div id="status">Initializing Phase 3 Benchmark Suite...</div>
  <pre id="output"></pre>

  <script type="module">
    import {
      loadModerationModel,
      classifyImage,
      classifyBatch,
      preprocessToCanvas,
      getMemoryStats,
      getEngineState,
      getActiveModelSource,
      disposeModerationModel,
      purgeModelCache,
      initTensorFlowRuntime,
      createModerationError,
      MODERATION_ERROR_CODES,
      MODEL_IDENTITY
    } from '/src/utils/moderation/nsfwModerator.js';

    import {
      extractVideoKeyframes,
      moderateVideo,
      calculateSampleTimestamps
    } from '/src/utils/moderation/videoFrameExtractor.js';

    import {
      classifyWithWorkerOrFallback,
      isWorkerSupported,
      terminateWorker
    } from '/src/utils/moderation/nsfwWorkerManager.js';

    const logEl = document.getElementById('output');
    const statusEl = document.getElementById('status');

    function log(msg) {
      logEl.textContent += msg + '\n';
      console.log(msg);
    }

    // Helper: generate synthetic test image Blob
    function createSyntheticImage(color = '#0284c7', label = 'Safe Test', width = 400, height = 300) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = '#ffffff';
      ctx.font = '24px sans-serif';
      ctx.fillText(label, 20, height / 2);
      return new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85));
    }

    // Helper: generate synthetic test video Blob (3 seconds WebM)
    function createSyntheticVideo(durationSec = 3) {
      return new Promise((resolve, reject) => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 320;
          canvas.height = 240;
          const ctx = canvas.getContext('2d');
          const stream = canvas.captureStream(30);
          const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
          const chunks = [];

          recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
          recorder.onstop = () => resolve(new Blob(chunks, { type: 'video/webm' }));

          recorder.start();
          let frame = 0;
          const totalFrames = durationSec * 30;
          const interval = setInterval(() => {
            frame++;
            ctx.fillStyle = frame % 2 === 0 ? '#1e293b' : '#334155';
            ctx.fillRect(0, 0, 320, 240);
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc((frame * 5) % 280 + 20, 120, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = '14px monospace';
            ctx.fillText(`Synthetic Video Frame ${frame}`, 16, 32);

            if (frame >= totalFrames) {
              clearInterval(interval);
              recorder.stop();
            }
          }, 1000 / 30);
        } catch (e) {
          reject(e);
        }
      });
    }

    async function runPhase3Benchmarks() {
      const results = {};

      try {
        log('============================================================');
        log('STARTING PHASE 3 NSFW ENGINE FOUNDATION BENCHMARKS');
        log('============================================================\n');

        // SECTION A: RUNTIME & BACKEND SELECTION
        statusEl.textContent = '1/8 Initializing runtime & checking backend...';
        log('--- Section A: Runtime & Backend Initialization ---');
        const runtime = await initTensorFlowRuntime();
        results.backend = runtime.backend;
        log(`✓ TensorFlow.js runtime initialized. Active backend: ${results.backend}`);

        // SECTION B: CONTROLLED CACHE & SINGLETON BENCHMARK
        statusEl.textContent = '2/8 Executing controlled cache benchmark (5 scenarios)...';
        log('\n--- Section B: Model Cache & Singleton Architecture ---');

        // Scenario 1: Fresh Load (Purge cache first to guarantee fresh load)
        await purgeModelCache();
        await disposeModerationModel();

        const startFresh = performance.now();
        const modelFresh = await loadModerationModel({ useIndexedDb: true });
        results.firstModelLoadMs = Math.round(performance.now() - startFresh);
        results.freshLoadSource = getActiveModelSource();
        log(`✓ Scenario 1 (Fresh Network Load): ${results.firstModelLoadMs} ms (source: ${results.freshLoadSource})`);

        // Scenario 2: Same-Session Memory Singleton
        const startMem = performance.now();
        const modelMem = await loadModerationModel();
        results.sameSessionReuseMs = Math.round((performance.now() - startMem) * 100) / 100;
        results.sameSessionSource = getActiveModelSource();
        log(`✓ Scenario 2 (Same-Session Singleton): ${results.sameSessionReuseMs} ms (source: ${results.sameSessionSource})`);

        // Scenario 3: New-Session IndexedDB Load (Dispose memory singleton to force IndexedDB read)
        await disposeModerationModel();
        const startIdb = performance.now();
        const modelIdb = await loadModerationModel({ useIndexedDb: true });
        results.indexedDbLoadMs = Math.round(performance.now() - startIdb);
        results.idbLoadSource = getActiveModelSource();
        log(`✓ Scenario 3 (New-Session IndexedDB Load): ${results.indexedDbLoadMs} ms (source: ${results.idbLoadSource})`);

        // Scenario 4: Corrupted Cache Recovery Test
        try {
          const req = indexedDB.open('tensorflowjs', 1);
          await new Promise((resolve) => {
            req.onsuccess = (e) => {
              const db = e.target.result;
              try {
                if (db.objectStoreNames.contains('models_store')) {
                  const tx = db.transaction('models_store', 'readwrite');
                  tx.objectStore('models_store').put({
                    modelPath: MODEL_IDENTITY.INDEXED_DB_KEY,
                    modelTopology: 'corrupted_topology_string'
                  });
                  tx.oncomplete = resolve;
                  tx.onerror = resolve;
                } else {
                  resolve();
                }
              } catch {
                resolve();
              }
            };
            req.onerror = resolve;
          });
        } catch {}

        await disposeModerationModel();
        const startCorrupt = performance.now();
        const modelRecovered = await loadModerationModel({ useIndexedDb: true });
        results.corruptRecoveryMs = Math.round(performance.now() - startCorrupt);
        results.corruptRecoverySource = getActiveModelSource();
        log(`✓ Scenario 4 (Corrupted Cache Recovery): ${results.corruptRecoveryMs} ms (recovered via: ${results.corruptRecoverySource})`);

        // Scenario 5: Single-Flight Promise Lock (3 concurrent requests)
        await disposeModerationModel();
        const [mA, mB, mC] = await Promise.all([
          loadModerationModel(),
          loadModerationModel(),
          loadModerationModel(),
        ]);
        const singleFlightPassed = (mA === mB && mB === mC);
        results.singleFlightLock = singleFlightPassed ? 'PASS' : 'FAIL';
        log(`✓ Single-Flight Concurrent Load Lock: ${results.singleFlightLock} (all 3 resolved to identical instance)`);

        // SECTION C: IMAGE PREPROCESSING & INFERENCE
        statusEl.textContent = '3/8 Benchmarking image preprocessing & inference...';
        log('\n--- Section C: Image Preprocessing & Inference ---');

        // Create large 3000x2000 synthetic image
        const largeImgBlob = await createSyntheticImage('#059669', 'Large 3K Image', 3000, 2000);
        const prepStart = performance.now();
        const prepObj = await preprocessToCanvas(largeImgBlob, 400);
        results.imagePreprocessingMs = Math.round(performance.now() - prepStart);
        prepObj.cleanup();
        log(`✓ Image preprocessing (3000x2000 downscaled to 400px): ${results.imagePreprocessingMs} ms`);

        // Classify standard image
        const testImgBlob = await createSyntheticImage('#0284c7', 'Neutral Bench', 400, 300);
        const classifyResult = await classifyImage(testImgBlob);
        results.imageInferenceMs = classifyResult.durationMs;
        results.dominantClass = classifyResult.dominantClass;
        results.confidence = classifyResult.confidence;
        results.probabilities = classifyResult.probabilities;
        log(`✓ Image inference: ${results.imageInferenceMs} ms (Dominant: ${results.dominantClass}, confidence: ${results.confidence})`);

        // SECTION D: WEB WORKER VS MAIN THREAD
        statusEl.textContent = '4/8 Benchmarking Web Worker off-thread inference...';
        log('\n--- Section D: Web Worker vs Main Thread ---');

        if (isWorkerSupported()) {
          const workerResult = await classifyWithWorkerOrFallback(testImgBlob);
          results.workerInferenceMs = workerResult.durationMs;
          results.workerExecutionMode = workerResult.executionMode;
          log(`✓ Worker inference: ${results.workerInferenceMs} ms (mode: ${results.workerExecutionMode})`);
        } else {
          results.workerInferenceMs = 'UNSUPPORTED';
          results.workerExecutionMode = 'main-thread-fallback';
          log('! Web Worker not supported in current environment');
        }

        // SECTION E: VIDEO KEYFRAME EXTRACTION & MODERATION
        statusEl.textContent = '5/8 Benchmarking video keyframe engine...';
        log('\n--- Section E: Video Keyframe Extraction & Moderation ---');

        const videoBlob = await createSyntheticVideo(3.5);
        log(`✓ Synthetic 3.5s video created: ${(videoBlob.size / 1024).toFixed(1)} KB`);

        // 5-Frame extraction
        const extract5 = await extractVideoKeyframes(videoBlob, { sampleCount: 5 });
        results.videoMetadataLoadMs = extract5.timing.metadataTimeMs;
        results.frameExtract5Ms = extract5.timing.frameExtractTimeMs;
        log(`✓ Video metadata load time: ${results.videoMetadataLoadMs} ms`);
        log(`✓ 5-frame extraction time: ${results.frameExtract5Ms} ms`);
        extract5.frames.forEach(f => f.cleanup && f.cleanup());

        // 8-Frame extraction
        const extract8 = await extractVideoKeyframes(videoBlob, { sampleCount: 8 });
        results.frameExtract8Ms = extract8.timing.frameExtractTimeMs;
        log(`✓ 8-frame extraction time: ${results.frameExtract8Ms} ms`);
        extract8.frames.forEach(f => f.cleanup && f.cleanup());

        // Full 5-Frame Moderation
        const videoMod5 = await moderateVideo(videoBlob, { sampleCount: 5 });
        results.video5TotalMs = videoMod5.timing.totalElapsedMs;
        results.video5ClassifyMs = videoMod5.timing.classifyTotalMs;
        results.video5AvgPerFrameMs = videoMod5.timing.averagePerFrameMs;
        log(`✓ 5-frame moderation total: ${results.video5TotalMs} ms (classify: ${results.video5ClassifyMs} ms, avg/frame: ${results.video5AvgPerFrameMs} ms)`);

        // Full 8-Frame Moderation
        const videoMod8 = await moderateVideo(videoBlob, { sampleCount: 8 });
        results.video8TotalMs = videoMod8.timing.totalElapsedMs;
        results.video8ClassifyMs = videoMod8.timing.classifyTotalMs;
        results.video8AvgPerFrameMs = videoMod8.timing.averagePerFrameMs;
        log(`✓ 8-frame moderation total: ${results.video8TotalMs} ms (classify: ${results.video8ClassifyMs} ms, avg/frame: ${results.video8AvgPerFrameMs} ms)`);

        // SECTION F: TENSOR MEMORY STABILITY (1, 5, 20 sequential inferences)
        statusEl.textContent = '6/8 Verifying tensor memory across 20 iterations...';
        log('\n--- Section F: Tensor Memory Accumulation Test ---');

        const memStart = getMemoryStats();
        log(`  Baseline active tensors: ${memStart?.numTensors ?? 0}`);

        // 5 inferences
        for (let i = 0; i < 5; i++) {
          const temp = await createSyntheticImage('#6366f1', `Batch ${i}`);
          await classifyImage(temp);
        }
        const memAfter5 = getMemoryStats();
        results.tensorDelta5 = (memAfter5?.numTensors ?? 0) - (memStart?.numTensors ?? 0);
        log(`✓ 5 inferences completed. Tensor Delta: ${results.tensorDelta5} (active tensors: ${memAfter5?.numTensors ?? 0})`);

        // 15 more (total 20)
        for (let i = 5; i < 20; i++) {
          const temp = await createSyntheticImage('#8b5cf6', `Batch ${i}`);
          await classifyImage(temp);
        }
        const memAfter20 = getMemoryStats();
        results.tensorDelta20 = (memAfter20?.numTensors ?? 0) - (memStart?.numTensors ?? 0);
        results.finalMemoryBytes = memAfter20?.numBytes ?? 0;
        log(`✓ 20 total inferences completed. Tensor Delta: ${results.tensorDelta20} (active tensors: ${memAfter20?.numTensors ?? 0})`);

        // SECTION G: CONCURRENCY CONTROL / BATCH TEST
        statusEl.textContent = '7/8 Testing concurrency control & batching...';
        log('\n--- Section G: Concurrency Control & Batch Processing ---');

        const batchItems = [
          await createSyntheticImage('#ef4444', 'Batch 1'),
          await createSyntheticImage('#f97316', 'Batch 2'),
          await createSyntheticImage('#eab308', 'Batch 3'),
        ];

        let progressEvents = 0;
        const batchResults = await classifyBatch(batchItems, {
          concurrency: 1,
          onProgress: () => { progressEvents++; },
        });

        results.batchCompletedCount = batchResults.length;
        results.batchProgressEvents = progressEvents;
        log(`✓ Batch processing: ${results.batchCompletedCount}/3 items completed with ${progressEvents} progress events.`);

        // SECTION H: CANCELLATION TEST
        statusEl.textContent = '8/8 Testing cancellation & timeout...';
        log('\n--- Section H: Cancellation & Timeout Protection ---');

        const abortController = new AbortController();
        abortController.abort(); // Cancel immediately

        let cancellationCaught = false;
        try {
          await classifyImage(testImgBlob, { signal: abortController.signal });
        } catch (err) {
          if (err.code === MODERATION_ERROR_CODES.CANCELLED) {
            cancellationCaught = true;
          }
        }
        results.cancellationHandled = cancellationCaught ? 'PASS' : 'FAIL';
        log(`✓ Cancellation handling: ${results.cancellationHandled}`);

        statusEl.textContent = 'Phase 3 Benchmarks Complete! ALL TESTS PASSED.';
        statusEl.className = 'pass';
        log('\n================ PHASE 3 BENCHMARK RESULTS (JSON) ================');
        log(JSON.stringify(results, null, 2));

        window.__PHASE3_RESULTS__ = results;
        window.__PHASE3_DONE__ = true;

        try {
          await fetch('/__benchmark_results', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ success: true, results }),
          });
        } catch {}

      } catch (err) {
        statusEl.textContent = `Phase 3 Benchmark Failed: ${err.message}`;
        statusEl.className = 'fail';
        log(`\nERROR: ${err.message}\n${err.stack}`);
        window.__PHASE3_ERROR__ = err.message;
        window.__PHASE3_DONE__ = true;

        try {
          await fetch('/__benchmark_results', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ success: false, error: err.message }),
          });
        } catch {}
      }
    }

    window.addEventListener('DOMContentLoaded', runPhase3Benchmarks);
  </script>
</body>
</html>
